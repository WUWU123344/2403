<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字信号处理工程2403班 - 座位表</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
}

/* ====== 标题栏 ====== */
.header-bar {
    background: #fff;
    border-radius: 16px;
    padding: 18px 30px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.header-bar h1 {
    font-size: 22px;
    color: #2c3e50;
}

.header-bar h1 span {
    color: #E63946;
}

.btn-print {
    padding: 10px 22px;
    border: none;
    border-radius: 30px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 500;
    background: linear-gradient(135deg, #2c3e50, #34495e);
    color: #fff;
}

.btn-print:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(44, 62, 80, 0.4);
}

/* ====== 教室布局 ====== */
.classroom {
    background: #fff;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.08);
}

/* 讲台 */
.podium {
    background: linear-gradient(135deg, #E63946, #C0392B);
    color: #fff;
    text-align: center;
    padding: 16px 30px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 10px;
    margin-bottom: 35px;
    box-shadow: 0 6px 20px rgba(230, 57, 70, 0.3);
}

/* 座位区域 */
.seating-area {
    display: flex;
    justify-content: center;
    gap: 50px;
}

/* 小组 */
.group {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* 每一排 */
.row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.row-number {
    width: 32px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ecf0f1;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    color: #7f8c8d;
    flex-shrink: 0;
}

/* 单个座位 */
.seat {
    width: 92px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffffff, #f8f9fa);
    border: 2px solid #dfe6e9;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    color: #2c3e50;
    transition: all 0.2s;
    cursor: default;
}

.seat:hover {
    border-color: #E63946;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(230, 57, 70, 0.2);
    color: #E63946;
}

.seat.empty {
    background: #fafbfc;
    border-style: dashed;
    color: #dfe6e9;
}

.seat.empty:hover {
    transform: none;
    box-shadow: none;
    border-color: #dfe6e9;
}

/* 走廊提示牌 */
.aisle {
    width: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    writing-mode: vertical-rl;
    letter-spacing: 4px;
    margin: 0 8px;
    background: linear-gradient(180deg, #F39C12, #E67E22);
    color: #fff;
    border-radius: 8px;
    padding: 15px 8px;
    box-shadow: 0 3px 12px rgba(243, 156, 18, 0.35);
    flex-shrink: 0;
}

/* 侧标签 (窗户/门口) */
.side-label {
    writing-mode: vertical-rl;
    font-size: 16px;
    font-weight: bold;
    padding: 15px 8px;
    border-radius: 8px;
    color: #fff;
    letter-spacing: 4px;
    align-self: center;
    flex-shrink: 0;
}

.label-window {
    background: linear-gradient(180deg, #3498db, #2980b9);
    box-shadow: 0 3px 12px rgba(52, 152, 219, 0.35);
}

.label-door {
    background: linear-gradient(180deg, #27ae60, #229954);
    box-shadow: 0 3px 12px rgba(39, 174, 96, 0.35);
}

/* ====== 打印样式 ====== */
@media print {
    body {
        background: #fff;
        padding: 0;
    }
    
    .btn-print, .side-label {
        display: none !important;
    }
    
    .classroom {
        box-shadow: none;
        padding: 10px;
    }
    
    .podium {
        background: #333 !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
    
    .seating-area {
        gap: 25px;
    }
    
    .aisle {
        background: #F39C12 !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
    
    .seat {
        width: 78px;
        height: 70px;
        font-size: 15px;
        border: 1px solid #999;
        background: #fff !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
    
    .seat.empty {
        border-style: dashed;
    }
    
    .row-number {
        background: #f0f0f0 !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
}
</style>
</head>
<body>
<div class="container">

    <!-- 标题栏 -->
    <div class="header-bar">
        <h1>📋 <span>数字信号处理 通信工程2403班级</span> 座位表</h1>
        <button class="btn-print" onclick="window.print()">🖨 打印座位表</button>
    </div>

    <!-- 教室布局 -->
    <div class="classroom">
        <div class="podium">讲 台</div>

        <div class="seating-area">
            <!-- 门口标签 -->
            <div class="side-label label-door">门 口</div>

            <!-- 左侧小组 -->
            <div class="group" id="leftGroup"></div>

            <!-- 走廊 -->
            <div class="aisle">走 廊</div>

            <!-- 右侧小组 -->
            <div class="group" id="rightGroup"></div>

            <!-- 窗户标签 -->
            <div class="side-label label-window">窗 户</div>
        </div>
    </div>
</div>

<script>
// ====== 座位数据 ======
// 原始数据（走廊侧靠中间）
const originalLeftGroup = [
    ['张志明', '高尚', '田佳璇', '刘丁语'],
    ['周鑫节', '徐巧芳', '何静', '刘香'],
    ['刘宇涛', '王鹏民', '叶海东', '杨欣'],
    ['余伟豪', '钟意', '蔡文涛', '曾凌'],
    ['王炫培', '谭建平', '戴俊宇', '刘志豪']
];

const originalRightGroup = [
    [null, '王晨菡', '付诗瑶', '张耀文', '刁炎坪', '杨佩鑫'],
    ['张语琴', '付晶晶', '皮雨鹭', '龚奎宇', '尹俊霖', '吴治桦'],
    [null, '陈怡佳', '何涛', '周新智', '陈欣瑾', '邓志丰'],
    [null, null, '张滔', '黄金涛', '孙林鹏', '郝家涛'],
    [null, null, '彭磊', '盛志豪', '邹伟', '王程']
];

// 左右互换 + 镜像翻转, 保证靠走廊的依旧靠走廊
const leftGroup = originalRightGroup.map(row => [...row].reverse());
const rightGroup = originalLeftGroup.map(row => [...row].reverse());

// ====== 渲染座位表 ======
function renderGroup(groupData, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    
    groupData.forEach((row, rowIndex) => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row';
        
        const rowNum = document.createElement('div');
        rowNum.className = 'row-number';
        rowNum.textContent = rowIndex + 1;
        rowDiv.appendChild(rowNum);
        
        row.forEach(name => {
            const seat = document.createElement('div');
            if (name === null) {
                seat.className = 'seat empty';
                seat.textContent = '';
            } else {
                seat.className = 'seat';
                seat.textContent = name;
            }
            rowDiv.appendChild(seat);
        });
        
        container.appendChild(rowDiv);
    });
}

renderGroup(leftGroup, 'leftGroup');
renderGroup(rightGroup, 'rightGroup');
</script>
</body>
</html>
